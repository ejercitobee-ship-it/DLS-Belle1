<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dunn's Luxury Selections - Intake Form</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin-top: 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #d4af37 0%, #f0d9b5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      font-size: 1.1rem;
      color: #b0b0b0;
      max-width: 600px;
      margin: 0 auto;
    }

    .form-wrapper {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(212, 175, 55, 0.15);
      min-height: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      min-height: 800px;
      border: none;
      display: block;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }

      .header p {
        font-size: 1rem;
      }

      .form-wrapper {
        min-height: 600px;
      }

      iframe {
        min-height: 600px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .container {
        margin-top: 20px;
      }

      .header {
        margin-bottom: 20px;
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .header p {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Dunn's Luxury Selections</h1>
      <p>Request a consultation or share your project details with our team</p>
    </div>

    <div class="form-wrapper">
      <iframe src="https://dunnluxuryselections.notion.site/ebd//22cd6dee67d342339463c4533465833a" allowfullscreen></iframe>
    </div>
  </div>
</body>
</html>
