[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/cart/c/*"
  to = "https://luxury-dunn-selections.myshopify.com/cart/c/:splat"
  status = 301

[[redirects]]
  from = "/cart/*"
  to = "https://luxury-dunn-selections.myshopify.com/cart/:splat"
  status = 301

[[redirects]]
  from = "/checkouts/*"
  to = "https://luxury-dunn-selections.myshopify.com/checkouts/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
